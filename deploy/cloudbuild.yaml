# Cloud Build pipeline for MEOK Compliance MCP flagship images.
# Triggers on push to main; builds all 4 flagships in parallel, pushes to GHCR.
#
# Usage:
#   gcloud builds submit --config deploy/cloudbuild.yaml

steps:
  # ── Build EU AI Act ──
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'PKG=eu-ai-act-compliance-mcp'
      - '-t'
      - 'ghcr.io/csoai-org/eu-ai-act-mcp:$COMMIT_SHA'
      - '-t'
      - 'ghcr.io/csoai-org/eu-ai-act-mcp:latest'
      - '.'
    id: 'build-eu-ai-act'

  # ── Build DORA ──
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'PKG=dora-compliance-mcp'
      - '-t'
      - 'ghcr.io/csoai-org/dora-mcp:$COMMIT_SHA'
      - '-t'
      - 'ghcr.io/csoai-org/dora-mcp:latest'
      - '.'
    id: 'build-dora'

  # ── Build NIS2 ──
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'PKG=nis2-compliance-mcp'
      - '-t'
      - 'ghcr.io/csoai-org/nis2-mcp:$COMMIT_SHA'
      - '-t'
      - 'ghcr.io/csoai-org/nis2-mcp:latest'
      - '.'
    id: 'build-nis2'

  # ── Build CRA ──
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'PKG=cra-compliance-mcp'
      - '-t'
      - 'ghcr.io/csoai-org/cra-mcp:$COMMIT_SHA'
      - '-t'
      - 'ghcr.io/csoai-org/cra-mcp:latest'
      - '.'
    id: 'build-cra'

  # ── Push all images ──
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker push ghcr.io/csoai-org/eu-ai-act-mcp:$COMMIT_SHA
        docker push ghcr.io/csoai-org/eu-ai-act-mcp:latest
        docker push ghcr.io/csoai-org/dora-mcp:$COMMIT_SHA
        docker push ghcr.io/csoai-org/dora-mcp:latest
        docker push ghcr.io/csoai-org/nis2-mcp:$COMMIT_SHA
        docker push ghcr.io/csoai-org/nis2-mcp:latest
        docker push ghcr.io/csoai-org/cra-mcp:$COMMIT_SHA
        docker push ghcr.io/csoai-org/cra-mcp:latest
    id: 'push-all'
    waitFor:
      - 'build-eu-ai-act'
      - 'build-dora'
      - 'build-nis2'
      - 'build-cra'

  # ── Deploy to Cloud Run (EU AI Act) ──
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'eu-ai-act-mcp'
      - '--image'
      - 'ghcr.io/csoai-org/eu-ai-act-mcp:$COMMIT_SHA'
      - '--region'
      - 'europe-west2'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--max-instances'
      - '10'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--port'
      - '8000'
    id: 'deploy-eu-ai-act'
    waitFor: ['push-all']

  # ── Deploy to Cloud Run (DORA) ──
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dora-mcp'
      - '--image'
      - 'ghcr.io/csoai-org/dora-mcp:$COMMIT_SHA'
      - '--region'
      - 'europe-west2'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--max-instances'
      - '10'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--port'
      - '8000'
    id: 'deploy-dora'
    waitFor: ['push-all']

  # ── Deploy to Cloud Run (NIS2) ──
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nis2-mcp'
      - '--image'
      - 'ghcr.io/csoai-org/nis2-mcp:$COMMIT_SHA'
      - '--region'
      - 'europe-west2'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--max-instances'
      - '10'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--port'
      - '8000'
    id: 'deploy-nis2'
    waitFor: ['push-all']

  # ── Deploy to Cloud Run (CRA) ──
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cra-mcp'
      - '--image'
      - 'ghcr.io/csoai-org/cra-mcp:$COMMIT_SHA'
      - '--region'
      - 'europe-west2'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--max-instances'
      - '10'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--port'
      - '8000'
    id: 'deploy-cra'
    waitFor: ['push-all']

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  substitutionOption: ALLOW_LOOSE

timeout: 1800s
