name: build-and-push-agentaudit

# Builds the standalone AgentAudit MCP image and pushes it to GHCR.
# Deliberately separate from build-push.yml (the flagship gateway matrix):
#   * agentaudit has its own Dockerfile in agentaudit/, not the repo root
#   * it ships from a wheel on PyPI (pip install agentaudit) once Nick publishes it,
#     so the PyPI-presence check matches the flagship pattern
#   * image tag is ghcr.io/csoai-org/agentaudit-mcp, distinct from the flagships
# After the first successful run, make the new package PUBLIC once:
#   GitHub → org Packages → agentaudit-mcp → Package settings → Change visibility → Public
# (account-gated UI step; cannot be automated).

on:
  push:
    branches: [main]
    paths:
      - agentaudit/Dockerfile
      - agentaudit/agentaudit/**
      - agentaudit/http_server.py
      - agentaudit/requirements.txt
      - agentaudit/pyproject.toml
      - agentaudit/smithery.yaml
      - .github/workflows/build-push-agentaudit.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  # cosign keyless signing (Signed-Releases scorecard check): the OIDC token
  # binds the signature to this workflow run — no key material to manage/leak.
  id-token: write

concurrency:
  group: build-push-agentaudit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v6

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check agentaudit exists on PyPI
        # Fail loud with a useful error if the wheel isn't published yet.
        # A 404 from pip install is opaque; this gives the maintainer a hint.
        run: |
          /usr/bin/python3 - <<'PY'
          import json, sys, urllib.request, urllib.error
          pkg = "agentaudit"
          url = f"https://pypi.org/pypi/{pkg}/json"
          try:
              d = json.loads(urllib.request.urlopen(url, timeout=10).read())
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  print(f"::error::PyPI package '{pkg}' not found. Publish it first (see agentaudit/PUBLISH.md step 3) or this build will fail on `pip install`.")
                  sys.exit(1)
              raise
          print(f"OK: {pkg} {d['info']['version']} ({d['urls'][0]['upload_time'] if d['urls'] else 'no files'})")
          PY

      - name: Build and push agentaudit
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: agentaudit
          push: true
          # Cloud Run and AWS AgentCore Runtime are amd64.
          platforms: linux/amd64
          provenance: false
          tags: |
            ghcr.io/csoai-org/agentaudit-mcp:latest
            ghcr.io/csoai-org/agentaudit-mcp:${{ github.sha }}
          cache-from: type=gha,scope=agentaudit
          cache-to: type=gha,scope=agentaudit,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v3

      - name: Sign image (keyless OIDC)
        # Signs by digest (not tag — tags are mutable) so marketplace buyers can
        # `cosign verify` provenance against this repo's workflow identity.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/csoai-org/agentaudit-mcp@${DIGEST}"

  sbom-and-scan:
    # Generates an SBOM and vulnerability report for the agentaudit image.
    # Required for AWS Marketplace seller registration and any compliance buyer
    # (the same wedge the gateway is built for — eat your own dog food).
    # Runs in parallel with `build` since it only needs the GHCR image.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          format: spdx-json
          artifact-name: sbom-agentaudit.spdx.json
          image: ghcr.io/csoai-org/agentaudit-mcp:${{ github.sha }}
          # No auth needed: after the `build` job pushes, the image is in the
          # org's GHCR (visibility may be private until manually flipped to public
          # in GitHub Packages UI — see top-of-file comment).

      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.24.0
        with:
          image-ref: ghcr.io/csoai-org/agentaudit-mcp:${{ github.sha }}
          format: sarif
          output: trivy-agentaudit.sarif
          # Fail on HIGH/CRITICAL — those are marketplace-blocking.
          severity: HIGH,CRITICAL
          # Don't scan OS packages by default; the image is python:3.11-slim with
          # only 2 pip deps, so a python-only scan keeps the report focused.
          scanners: vuln
          vuln-type: os,library
          ignore-unfixed: true

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: scan-agentaudit
          path: |
            sbom-agentaudit.spdx.json
            trivy-agentaudit.sarif
          retention-days: 30
