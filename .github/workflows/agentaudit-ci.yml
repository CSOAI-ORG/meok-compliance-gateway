name: ci

# Pytest + lint for agentaudit. Hermetic: runs under a temp HOME so the live
# ~/.meok/ counters on the operator's machine are not touched (per AGENTS.md).
# Follows the keystone's test-gateway.yml pattern (scoped permissions, exact-pinned deps).

on:
  push:
    branches: [main, "feat/*", "chore/*", "fix/*"]
    paths:
      - "agentaudit/**"
      - ".github/workflows/agentaudit-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "agentaudit/**"
      - ".github/workflows/agentaudit-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install runtime + dev
        run: |
          python -m pip install --upgrade pip
          pip install -r agentaudit/requirements.txt
          pip install -e ./agentaudit
          pip install 'agentaudit[dev]'

      - name: Lint (compile-only)
        run: |
          python -m py_compile agentaudit/agentaudit/server.py
          python -m py_compile agentaudit/agentaudit/x402.py

      - name: Pytest
        # Hermetic: a temp HOME is set so ~/.meok/ (live fleet counters) is never read.
        env:
          HOME: ${{ runner.temp }}/hermetic-home
        run: |
          cd agentaudit
          python -m pytest tests/ -v

  fuzz:
    name: hypothesis fuzz (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Only on PRs (heavier) and main merges — skip on every push to feat/* to save minutes.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install runtime + dev
        run: |
          python -m pip install --upgrade pip
          pip install -r agentaudit/requirements.txt
          pip install -e ./agentaudit
          pip install 'agentaudit[fuzz]'

      - name: Fuzz
        env:
          HOME: ${{ runner.temp }}/hermetic-home
        run: |
          cd agentaudit
          python -m pytest fuzz/ -v
