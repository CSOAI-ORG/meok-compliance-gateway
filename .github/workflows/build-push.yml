name: build-and-push

# Builds the flagship MCP images and pushes them to GHCR.
# This is what makes GCP_DEPLOY.md "Path B" real — without it, the
# ghcr.io/csoai-org/<flagship>-mcp:latest images referenced there do not exist.
#
# After the first successful run, make each new package PUBLIC once:
#   GitHub → org Packages → <flagship>-mcp → Package settings → Change visibility → Public
# (account-gated UI step; cannot be automated).

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - http_server.py
      - requirements-gateway.txt
      - constraints.txt
      - .github/workflows/build-push.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  # cosign keyless signing (Signed-Releases scorecard check): the OIDC token
  # binds the signature to this workflow run — no key material to manage/leak.
  id-token: write

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flagship: eu-ai-act
            pkg: eu-ai-act-compliance-mcp
          - flagship: dora
            pkg: dora-compliance-mcp
          - flagship: nis2
            pkg: nis2-compliance-mcp
          - flagship: cra
            pkg: cra-compliance-mcp
          # === 2026-06-06 batch: 4 security/ops flagships ===
          - flagship: threat-intelligence
            pkg: threat-intelligence-mcp
          - flagship: vulnerability-scanner
            pkg: vulnerability-scanner-mcp
          - flagship: red-team-ops
            pkg: red-team-ops-mcp
          - flagship: policy-engine
            pkg: policy-engine-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check flagship exists on PyPI
        # Fail loud with a useful error if the flagship wheel isn't published yet.
        # A 404 from pip install is opaque; this gives the maintainer a hint.
        run: |
          /usr/bin/python3 - <<'PY' "${{ matrix.pkg }}"
          import json, sys, urllib.request, urllib.error
          pkg = sys.argv[1]
          url = f"https://pypi.org/pypi/{pkg}/json"
          try:
              d = json.loads(urllib.request.urlopen(url, timeout=10).read())
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  print(f"::error::PyPI package '{pkg}' not found. Publish it first (see FLEET_BASE.md) or remove it from the matrix.")
                  sys.exit(1)
              raise
          print(f"OK: {pkg} {d['info']['version']} ({d['urls'][0]['upload_time'] if d['urls'] else 'no files'})")
          PY

      - name: Build and push ${{ matrix.flagship }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Cloud Run and AWS AgentCore Runtime are amd64.
          platforms: linux/amd64
          provenance: false
          build-args: PKG=${{ matrix.pkg }}
          # Org slug is lowercased to satisfy GHCR; matches GCP_DEPLOY.md Path B exactly.
          tags: |
            ghcr.io/csoai-org/${{ matrix.flagship }}-mcp:latest
            ghcr.io/csoai-org/${{ matrix.flagship }}-mcp:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.flagship }}
          cache-to: type=gha,scope=${{ matrix.flagship }},mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless OIDC)
        # Signs by digest (not tag — tags are mutable) so marketplace buyers can
        # `cosign verify` provenance against this repo's workflow identity.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/csoai-org/${{ matrix.flagship }}-mcp@${DIGEST}"

  sbom-and-scan:
    # Generates an SBOM and vulnerability report for each flagship image.
    # Required for AWS Marketplace seller registration and any compliance buyer
    # (the same wedge the gateway is built for — eat your own dog food).
    # Runs in parallel with `build` since it only needs the GHCR image.
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flagship: eu-ai-act
          - flagship: dora
          - flagship: nis2
          - flagship: cra
          - flagship: threat-intelligence
          - flagship: vulnerability-scanner
          - flagship: red-team-ops
          - flagship: policy-engine
    steps:
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          artifact-name: sbom-${{ matrix.flagship }}.spdx.json
          image: ghcr.io/csoai-org/${{ matrix.flagship }}-mcp:${{ github.sha }}
          # No auth needed: after the `build` job pushes, the image is in the
          # org's GHCR (visibility may be private until manually flipped to public
          # in GitHub Packages UI — see top-of-file comment).

      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/csoai-org/${{ matrix.flagship }}-mcp:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.flagship }}.sarif
          # Fail on HIGH/CRITICAL — those are marketplace-blocking.
          severity: HIGH,CRITICAL
          # Don't scan OS packages by default; the image is python:3.11-slim with
          # only 2 pip deps, so a python-only scan keeps the report focused.
          scanners: vuln
          vuln-type: os,library
          ignore-unfixed: true

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.flagship }}
          path: |
            sbom-${{ matrix.flagship }}.spdx.json
            trivy-${{ matrix.flagship }}.sarif
          retention-days: 30
