name: scorecard
on:
  push:
    branches: [main]
  schedule:
    # Weekly on Mondays at 06:17 UTC (off-the-hour to spread load)
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      # The action needs id-token for OIDC publishing to the security-scorecards
      # dashboard (optional; omit if you don't want to publish).
      id-token: write
      # Read the repo contents to scan.
      contents: read
      # Required by the action to comment on PRs.
      pull-requests: read
    steps:
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.4.0
        with:
          # Public results API. The dashboard is at https://scorecard.dev/viewer/?uri=github.com/<org>/<repo>
          results_file: results.sarif
          results_format: sarif
          # Publish to the official dashboard so the score appears at scorecard.dev
          publish_results: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 90
