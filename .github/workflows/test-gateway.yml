name: test-gateway

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install gateway runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gateway.txt
          # Install a stub `server` module so http_server.py imports cleanly in CI.
          # Production builds get the real `server` from the flagship PKG via Docker.

      - name: Lint http_server.py
        run: |
          python -m py_compile http_server.py
          # Compile-only check. The previous `test.yml` used `py_compile server.py`,
          # which is N/A here — the real entrypoint is http_server.py.

      - name: Import smoke
        run: |
          # Stub the imported `server` module so the import in http_server.py succeeds.
          mkdir -p /tmp/stub && cat > /tmp/stub/server.py <<'PY'
          class _MCP:
              settings = type("S", (), {"host": "", "port": 0, "transport_security": None})()
              def custom_route(self, *a, **k):
                  def deco(fn): return fn
                  return deco
              def run(self, *a, **k): pass
          mcp = _MCP()
          PY
          PYTHONPATH=/tmp/stub python -c "import importlib.util, sys; spec=importlib.util.spec_from_file_location('http_server','http_server.py'); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); print('import OK')"

      - name: x402 paid-tool helper tests
        run: |
          # base x402 (no [evm]) is enough for the no-op + challenge paths; verify/settle
          # needs a funded wallet and is exercised in staging, not CI.
          # hypothesis powers tests/test_x402_properties.py (derandomized fuzz).
          pip install x402 pytest hypothesis
          pytest tests/test_x402.py tests/test_x402_properties.py -v

  e2e:
    # Real end-to-end: install a flagship PKG, boot the ACTUAL gateway, and drive
    # it with the mcp streamable-HTTP client (real initialize + tools/list). This
    # replaces the old "mock server" step, which only asserted a hand-coded FastAPI
    # app returned what it was coded to return — green CI that tested nothing real.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install gateway runtime + a real flagship
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gateway.txt eu-ai-act-compliance-mcp

      - name: Boot gateway + run real e2e (initialize + tools/list + /healthz)
        run: |
          PORT=8000 python http_server.py &
          echo $! > /tmp/gateway.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz \
            | python -c "import json,sys; assert json.load(sys.stdin)['status']=='ok'; print('healthz OK')"
          python tests/e2e_smoke.py

      - name: Assert MCP 2026-07-28 stateless contract
        # Guards the stateless migration: no Mcp-Session-Id header, JSON responses,
        # independent requests — the properties a round-robin LB depends on.
        run: GATEWAY_URL=http://127.0.0.1:8000/mcp python tests/stateless_check.py

      - name: Concurrency load test
        # Proves the stateless gateway holds up under parallel agent traffic.
        run: GATEWAY_URL=http://127.0.0.1:8000 LOAD_N=200 LOAD_CONCURRENCY=50 python tests/load_test.py

      - name: Stop gateway
        if: always()
        run: kill "$(cat /tmp/gateway.pid)" 2>/dev/null || true
