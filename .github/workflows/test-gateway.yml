name: test-gateway

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install gateway runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gateway.txt
          # Install a stub `server` module so http_server.py imports cleanly in CI.
          # Production builds get the real `server` from the flagship PKG via Docker.

      - name: Lint http_server.py
        run: |
          python -m py_compile http_server.py
          # Compile-only check. The previous `test.yml` used `py_compile server.py`,
          # which is N/A here — the real entrypoint is http_server.py.

      - name: Import smoke
        run: |
          # Stub the imported `server` module so the import in http_server.py succeeds.
          mkdir -p /tmp/stub && cat > /tmp/stub/server.py <<'PY'
          class _MCP:
              settings = type("S", (), {"host": "", "port": 0, "transport_security": None})()
              def custom_route(self, *a, **k):
                  def deco(fn): return fn
                  return deco
              def run(self, *a, **k): pass
          mcp = _MCP()
          PY
          PYTHONPATH=/tmp/stub python -c "import importlib.util, sys; spec=importlib.util.spec_from_file_location('http_server','http_server.py'); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); print('import OK')"

      - name: x402 paid-tool helper tests
        run: |
          # base x402 (no [evm]) is enough for the no-op + challenge paths; verify/settle
          # needs a funded wallet and is exercised in staging, not CI.
          # hypothesis powers tests/test_x402_properties.py (derandomized fuzz).
          pip install x402 pytest hypothesis
          pytest tests/test_x402.py tests/test_x402_properties.py -v

  e2e:
    # Real end-to-end: install a flagship PKG, boot the ACTUAL gateway, and drive
    # it with the mcp streamable-HTTP client (real initialize + tools/list). This
    # replaces the old "mock server" step, which only asserted a hand-coded FastAPI
    # app returned what it was coded to return — green CI that tested nothing real.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install gateway runtime + a real flagship
        # Pin the flagship to the gold-standard version (1.8.1 as of 2026-06-03).
        # Bump deliberately when the upstream release is tested against the gateway.
        # Without the pin, a new flagship release can break the gateway's import
        # chain (mcp SDK / FastMCP API surface) without warning.
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements-gateway.txt eu-ai-act-compliance-mcp==1.8.1

      - name: Boot gateway + run real e2e (initialize + tools/list + /healthz)
        run: |
          PORT=8000 python http_server.py &
          echo $! > /tmp/gateway.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz \
            | python -c "import json,sys; assert json.load(sys.stdin)['status']=='ok'; print('healthz OK')"
          python tests/e2e_smoke.py

      - name: Assert MCP 2026-07-28 stateless contract
        # Guards the stateless migration: no Mcp-Session-Id header, JSON responses,
        # independent requests — the properties a round-robin LB depends on.
        run: GATEWAY_URL=http://127.0.0.1:8000/mcp python tests/stateless_check.py

      - name: Concurrency load test
        # Proves the stateless gateway holds up under parallel agent traffic.
        run: GATEWAY_URL=http://127.0.0.1:8000 LOAD_N=200 LOAD_CONCURRENCY=50 python tests/load_test.py

      - name: Stop gateway
        if: always()
        run: kill "$(cat /tmp/gateway.pid)" 2>/dev/null || true

  x402-rail-smoke:
    # Guards the revenue rail against future x402 SDK upgrades. The
    # `meok_x402.paywalled` wrapper accepts both v0 and v1 PaymentPayload
    # shapes; if a future SDK drops one (or a pin bump breaks the
    # `model_validate` path), this job fails before the change can merge.
    # Runs in --skip-settle mode by default — no facilitator, no wallet,
    # no network. The point is the substrate shape, not the network call.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install gateway runtime + x402 + eth_account
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gateway.txt x402 eth-account pytest

      - name: Boot + challenge roundtrip
        # The smoke imports `server` (the keystone module) and drives the
        # exact same code path that an MCP client would: tool call without
        # payment → PaymentRequired challenge → assert shape.
        env:
          X402_ENABLED: "1"
          X402_PAY_TO: "0x1234567890123456789012345678901234567890"
          X402_NETWORK: "eip155:84532"
          MEOK_ATTESTATION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: |
          python scripts/test_x402_settlement.py --skip-settle

      - name: Sign a USDC payment (offline, no facilitator)
        # Proves the SDK's `register_v1` + `ExactEvmScheme` path produces
        # a v1 PaymentPayload the keystone's `paywalled` wrapper can
        # match. Uses a throwaway test key; no USDC, no facilitator.
        env:
          X402_ENABLED: "1"
          X402_PAY_TO: "0x1234567890123456789012345678901234567890"
          X402_NETWORK: "eip155:84532"
          MEOK_ATTESTATION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: |
          python3 - <<'PY'
          import os, sys, json
          sys.path.insert(0, '.')
          from eth_account import Account
          from x402.client import x402ClientSync
          from x402.mechanisms.evm.exact.client import ExactEvmScheme
          from x402.schemas import PaymentRequired, ResourceInfo, PaymentRequirements
          acct = Account.create()
          client = x402ClientSync()
          client.register_v1(os.environ['X402_NETWORK'], ExactEvmScheme(acct))
          pr = PaymentRequired(
              x402_version=1, error='Payment required',
              resource=ResourceInfo(url='mcp://tool/sign_receipt', service_name='meok'),
              accepts=[PaymentRequirements(
                  scheme='exact', network=os.environ['X402_NETWORK'],
                  asset='0x036CbD53842c5426634e7929541eC2318f3dCF7e',
                  amount='50000', pay_to=os.environ['X402_PAY_TO'], max_timeout_seconds=300,
              )],
          )
          signed = client.create_payment_payload(pr)
          # Assert v1 shape
          assert hasattr(signed, 'scheme') and signed.scheme == 'exact', f'not v1: {type(signed).__name__}'
          assert hasattr(signed, 'payload') and 'authorization' in signed.payload, 'no authorization'
          # Re-validate on the keystone side
          from meok_x402 import paywalled
          from x402.schemas import PaymentPayload, PaymentPayloadV1
          wire = signed.model_dump(by_alias=True, mode='json')
          recon = PaymentPayloadV1.model_validate(wire)
          print(f'OK: signed {type(signed).__name__}, keystone accepted v1 wire')
          PY

      - name: Pytest
        # 15/15 must stay green. If a future change breaks any test, fail.
        run: pytest tests/ -q
