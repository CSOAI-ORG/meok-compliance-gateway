[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentaudit"
version = "0.1.0"
description = "AgentAudit — Regulatory compliance, audit trails, and trust scoring for AI agent protocols (MCP, A2A, ANP)."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "MEOK AI Labs", email = "nicholas@meok.ai"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Security",
]
keywords = ["agent", "mcp", "a2a", "compliance", "audit", "eu-ai-act", "dora", "nis2", "trust"]
requires-python = ">=3.10"
dependencies = [
    "mcp==1.27.2",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
x402 = ["x402[evm]==2.12.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4.0", "hypothesis>=6.100.0"]

[project.urls]
Homepage = "https://github.com/agentaudit-org/agentaudit"
Repository = "https://github.com/agentaudit-org/agentaudit"

[project.scripts]
agentaudit-server = "agentaudit.server:main"

[tool.setuptools.packages.find]
# Only the runtime package ships in the wheel; `tests/` and `fuzz/` are
# repo-only (run via `pytest` from the checkout, not from the wheel).
include = ["agentaudit*"]
namespaces = false
